[package]
name = "engine-harness"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
description = "Live test of the vendored engine's VoiceClient (the code the game runs) against a real Paper server with the official Simple Voice Chat plugin"

[dependencies]
flate2 = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
svchorizon-protocol = { path = "../../crates/svchorizon-protocol" }
svchorizon-engine = { path = "../../mixins/svchorizon/engine" }
