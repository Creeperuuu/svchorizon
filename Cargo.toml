[workspace]
members = ["crates/svchorizon-protocol", "tools/interop-harness"]
# The bundle engine is its own crate (staged into Horizon by horizon-mixins);
# keep it out of this workspace so it can be tested standalone.
exclude = ["mixins/svchorizon/engine"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
