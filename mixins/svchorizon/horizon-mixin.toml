[mod]
id = "svchorizon"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "ba6344a59cb9e755b730dcf02285fc0d33b97d3c"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "svchorizon"
source = "runtime.rs"

[[injection]]
id = "voicechat-packet"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::handle_packet"
helper = "handle_packet.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "self" },
  { name = "packet", ty = "&horizon_protocol::packets::play::Clientbound", value = "&packet" }
]

[[crate]]
id = "engine"
path = "engine"
dependent = "horizon-client"

[[injection]]
id = "voice-tick"
hook = "tick"
hook_version = 1
kind = "HEAD"
helper = "native_tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "self" }]

[[injection]]
id = "voice-key"
hook = "key"
hook_version = 1
kind = "HEAD"
helper = "native_key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" }
]

[[injection]]
id = "voice-mods-page"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "native_mods.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "mods" }
]

[[injection]]
id = "voice-command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "native_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" }
]

[[injection]]
id = "voice-hud"
hook = "hud"
hook_version = 1
kind = "HEAD"
helper = "native_hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "corners" }
]

[[injection]]
id = "voice-settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "native_settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "buttons" }
]

[[injection]]
id = "voice-settings-click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "native_settings_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" }
]

# The integrated/LAN hub feeds the hosted voice server: per guest, per tick.
[[injection]]
id = "voice-hub"
kind = "HEAD"
target = "horizon_client::lan::hub::Hub::process_inbox"
helper = "voice_hub.rs"
bindings = [
  { name = "hub", ty = "&mut crate::lan::hub::Hub", value = "self" },
  { name = "guest_index", ty = "usize", value = "i" }
]

[[module]]
id = "remote-positions"
file = "crates/horizon-client/src/game/remote.rs"
name = "svchorizon_voice"
source = "remote.rs"

# The real remote address of the game's TCP connection (the SRV target, not the
# typed name), which is where an official client sends voice when the server's
# voice_host is empty. Two support modules, because the stream is private to the
# protocol crate and the session's writer is private to net.rs.
[[module]]
id = "protocol-peer"
file = "crates/horizon-protocol/src/connection.rs"
name = "svchorizon_peer"
source = "peer_protocol.rs"
visibility = "pub"

[[module]]
id = "net-peer"
file = "crates/horizon-client/src/net.rs"
name = "svchorizon_net"
source = "peer_net.rs"
visibility = "pub"
