[package]
name = "svchorizon-engine"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.95"
description = "Simple Voice Chat UDP and Opus engine embedded into Horizon"

[lib]
path = "src/lib.rs"
doctest = false

[features]
default = ["std", "heap"]
std = []
heap = ["std"]
libm = []
portable-atomic = []

[dependencies]
cpal = "0.16.0"
ring = "0.17.14"
