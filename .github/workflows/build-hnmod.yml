name: Build SVC Horizon hnmod
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package hnmod
        run: python tools/package.py
      - name: Upload hnmod
        uses: actions/upload-artifact@v4
        with:
          name: svchorizon-hnmod
          path: target/svchorizon-0.1.0.hnmod
          if-no-files-found: error
          compression-level: 0
