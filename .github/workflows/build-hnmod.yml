name: Build SVC Horizon hnmod
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format sources
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Test protocol core
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  native-mixin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: ba6344a59cb9e755b730dcf02285fc0d33b97d3c
          path: horizon
      - uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon-mixins
          ref: d9c83d7096b7ea5b83678da2efdfd6161f74997e
          path: horizon-mixins
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Fetch mixin tooling
        run: cargo fetch --locked --manifest-path horizon-mixins/Cargo.toml
      - name: Fetch pinned Horizon dependencies
        run: cargo fetch --locked --manifest-path horizon/Cargo.toml
      - name: Stage vendored Opus engine into the native bundle
        run: python tools/prepare_bundle.py
      - name: Build mixin CLI
        run: cargo build --locked --manifest-path horizon-mixins/Cargo.toml -p horizon-mixins-cli
      - name: Prepare plan output directory
        run: mkdir -p target/mixins
      - name: Plan native hooks
        run: cargo run --locked --manifest-path horizon-mixins/Cargo.toml -p horizon-mixins-cli -- plan --workspace horizon --mods mixins --out target/mixins/plan.json
      - name: Apply native hooks
        run: cargo run --locked --manifest-path horizon-mixins/Cargo.toml -p horizon-mixins-cli -- apply --workspace horizon --mods mixins --out target/mixins/modded
      - name: Compile and test the actual native mixin
        run: cargo run --locked --manifest-path horizon-mixins/Cargo.toml -p horizon-mixins-cli -- check --workspace horizon --mods mixins --out target/mixins/modded --trust-native-mods

  engine-windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stage bundled engine
        run: python tools/prepare_bundle.py
      - name: Compile Opus, AES-GCM and CPAL on Windows
        run: cargo check --manifest-path mixins/svchorizon/engine/Cargo.toml

  package:
    needs: [protocol-tests, native-mixin-check, engine-windows-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package hnmod
        run: python tools/package.py
      - name: Upload hnmod
        uses: actions/upload-artifact@v4
        with:
          name: svchorizon-hnmod
          path: target/svchorizon-0.1.0.hnmod
          if-no-files-found: error
          compression-level: 0
