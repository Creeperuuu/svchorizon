name: Build game (Windows)
# Builds horizon-client.exe (Windows x64) from the pinned Horizon revision with the
# SVC mod's native mixins compiled in, replacing the hour-long local build.
#
# The flow mirrors build-hnmod.yml's native-mixin-check job (stage the vendored engine
# bundle, then horizon-mixins apply into a staged workspace) and Horizon's own
# game-build.yml Windows matrix (release profile, --locked, the C runtime linked in
# with crt-static so the game runs without the Visual C++ redistributable).
# After apply, the staged workspace is a normal Cargo workspace: the game is built
# from it with a shared --target-dir so the caches below make later runs rebuild
# only what changed instead of the whole hour.
#
# Build profiles (workflow input):
#   fast    - Horizon's own [profile.fast]: same optimization level as release but
#             no LTO, 16 codegen units and incremental compilation. Much faster to
#             build and link; ideal for iterating.
#   release - the shippable profile (thin LTO, single codegen unit). Slower; use
#             for a final binary.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo profile to build horizon-client.exe with"
        type: choice
        required: true
        default: fast
        options:
          - fast
          - release

permissions:
  contents: read

concurrency:
  group: build-game-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  HORIZON_REVISION: ba6344a59cb9e755b730dcf02285fc0d33b97d3c
  HORIZON_MIXINS_REVISION: d9c83d7096b7ea5b83678da2efdfd6161f74997e

jobs:
  windows:
    name: horizon-client.exe (windows x64, ${{ inputs.profile }})
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      # The C runtime linked in, so the game runs without the Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
      # API-triggered runs may omit the input; the default keeps them working.
      BUILD_PROFILE: ${{ inputs.profile || 'fast' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Force LF checkouts
        # Git for Windows would otherwise check text files out with CRLF, and the pinned
        # horizon-mixins revision parses Cargo.lock as LF text (its CRLF handling is newer
        # than the pinned revision): a CRLF lock makes apply fail with "the dependent has
        # no workspace entry in Cargo.lock".
        run: git config --global core.autocrlf false

      - name: Checkout pinned Horizon
        uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: ${{ env.HORIZON_REVISION }}
          path: horizon
          persist-credentials: false

      - name: Re-checkout pinned Horizon with LF endings
        # Belt and braces for the step above: rewrite every tracked file straight from
        # the index with autocrlf off, so the workspace is byte-identical to the Linux
        # checkouts this mod was validated against.
        run: |
          cd horizon
          git config core.autocrlf false
          git checkout-index --force --all

      - name: Materialize tracked symlinks in pinned Horizon
        run: |
          cd horizon
          git ls-files -s | awk '$1 == 120000 {print $4}' | while IFS= read -r link; do
            [ -n "$link" ] || continue
            target=$(git cat-file blob "HEAD:$link")
            rm -f "$link"
            cp -L "$target" "$link"
          done

      - name: Checkout pinned horizon-mixins
        uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon-mixins
          ref: ${{ env.HORIZON_MIXINS_REVISION }}
          path: horizon-mixins
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Restore and save are split so a failed or cancelled run still publishes
      # the cache it managed to build up; with the single actions/cache@v4 step
      # a failure threw the whole warm-up away.
      - name: Restore cargo caches
        id: restore-caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/index
            ~/.cargo/git
            game-target
            horizon-mixins/target
          # The game target directory is keyed on the pinned Horizon lockfile, not the
          # mod sources: cargo's own fingerprints rebuild only the crates the mod touched.
          # The mixin CLI cache is keyed on the horizon-mixins lockfile.
          key: horizon-game-win-1.95.0-${{ inputs.profile }}-${{ env.HORIZON_REVISION }}-${{ hashFiles('horizon/Cargo.lock') }}
          restore-keys: |
            horizon-game-win-1.95.0-${{ inputs.profile }}-${{ env.HORIZON_REVISION }}-
            horizon-game-win-1.95.0-fast-${{ env.HORIZON_REVISION }}-
            horizon-game-win-1.95.0-release-${{ env.HORIZON_REVISION }}-
            horizon-game-win-1.95.0-

      - name: Fetch dependencies
        run: |
          cargo fetch --locked --manifest-path horizon-mixins/Cargo.toml
          cargo fetch --locked --manifest-path horizon/Cargo.toml

      - name: Stage vendored Opus engine into the native bundle
        run: python tools/prepare_bundle.py

      - name: Apply the SVC mod into a staged Horizon workspace
        run: |
          cargo run --locked --manifest-path horizon-mixins/Cargo.toml -p horizon-mixins-cli -- \
            apply --workspace horizon --mods mixins --out game-stage

      - name: Build horizon-client.exe (${{ inputs.profile }})
        run: |
          if [ "$BUILD_PROFILE" = "fast" ]; then
            cargo build --profile fast --locked -p horizon-client --bin horizon-client \
              --manifest-path game-stage/Cargo.toml --target-dir game-target
          else
            cargo build --release --locked -p horizon-client --bin horizon-client \
              --manifest-path game-stage/Cargo.toml --target-dir game-target
          fi

      - name: The game starts
        run: |
          test -f "game-target/$BUILD_PROFILE/horizon-client.exe"
          "game-target/$BUILD_PROFILE/horizon-client.exe" --help | grep -q -- '--resources'

      - name: Save cargo caches
        # Always, so failed builds still warm the cache for the next attempt.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/index
            ~/.cargo/git
            game-target
            horizon-mixins/target
          key: ${{ steps.restore-caches.outputs.cache-primary-key }}

      - name: Job summary
        if: always()
        run: |
          {
            echo "### horizon-client.exe (Windows x64, SVC mod compiled in)"
            echo
            echo "- Horizon: \`${{ env.HORIZON_REVISION }}\`"
            echo "- Mod commit: \`${{ github.sha }}\`"
            echo "- Profile: \`${{ inputs.profile }}\`"
            echo
            echo "Download the \`horizon-client-windows-x64-svchorizon\` artifact and replace"
            echo "\`horizon-client.exe\` in your Horizon game folder (keep a backup of the original)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-client-windows-x64-svchorizon
          path: game-target/${{ inputs.profile }}/horizon-client.exe
          if-no-files-found: error
          compression-level: 0
